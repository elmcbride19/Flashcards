<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Providence Christian Flashcards</title>
<style>
  :root {
    --navy: #0c3467;
    --cardinal: #c41e3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f1f4f8;
    color: #152238;
    font-family: Georgia, serif;
  }

  header {
    background: var(--navy);
    color: white;
    padding: 28px 16px;
    text-align: center;
    border-bottom: 5px solid var(--cardinal);
  }

  h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 36px); }
  header p { margin: 0; }

  main {
    max-width: 800px;
    margin: 28px auto;
    padding: 0 16px 32px;
  }

  .toolbar, .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 18px 0;
  }

  button {
    border: 0;
    border-radius: 8px;
    padding: 13px 20px;
    background: var(--navy);
    color: white;
    font: bold 16px Arial, sans-serif;
    cursor: pointer;
  }

  button:hover { filter: brightness(1.15); }
  button:focus-visible { outline: 3px solid #e6aa24; outline-offset: 4px; }
  .accent { background: var(--cardinal); }

  #counter {
    font: bold 16px Arial, sans-serif;
    text-align: center;
    margin: 14px 0;
  }

  #card {
    width: 100%;
    min-height: 330px;
    padding: 32px 24px;
    background: white;
    color: #152238;
    border: 2px solid #d6deea;
    border-top: 6px solid var(--navy);
    border-radius: 16px;
    box-shadow: 0 8px 26px #0c346714;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
    font: inherit;
  }

  #card:hover { filter: none; }
  #card.answer { border-top-color: var(--cardinal); }

  #side {
    color: var(--navy);
    font: bold 13px Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #text {
    font-size: clamp(21px, 4vw, 28px);
    line-height: 1.5;
    white-space: pre-wrap;
  }

  #hint {
    font: 14px Arial, sans-serif;
    color: #657084;
  }

  .instructions {
    text-align: center;
    color: #657084;
    font: 14px/1.6 Arial, sans-serif;
  }

  progress {
    display: block;
    width: 100%;
    height: 10px;
    accent-color: var(--cardinal);
  }
</style>
</head>
<body>

<header>
  <h1>Providence Christian Flashcards</h1>
  <p>Montgomery Academy Football</p>
</header>

<main>
  <div class="toolbar">
    <button id="shuffle" class="accent">Shuffle</button>
    <button id="restart">Restart</button>
  </div>

  <div id="counter" aria-live="polite"></div>
  <progress id="progress" value="1" max="66" aria-label="Card position"></progress>

  <div style="margin-top: 20px">
    <button id="card" aria-label="Flashcard. Select to reveal answer.">
      <span id="side">Question</span>
      <span id="text"></span>
      <span id="hint">Tap to reveal answer</span>
    </button>
  </div>

  <div class="controls">
    <button id="previous">← Previous</button>
    <button id="flip" class="accent">Show Answer</button>
    <button id="next">Next →</button>
  </div>

  <p class="instructions">
    Tap the card to flip it.<br>
    Keyboard: ← Previous · → Next · Space to flip
  </p>
</main>

    "Slants away from the walked-up boundary defender or away from the jet action."

    "An aggressive early-down Cover 0 look with safeties pressed down near 6 yards depth."
  ],
  [

    "Leaves starting cornerbacks #12 and #4 isolated in 1-on-1 man coverage without safety support."
  ],
  [

    "Obvious passing situations, specifically 2nd & long, 3rd & long, and 4th & long."
  ],
  [
    "How do safety depths alter between early downs and obvious passing downs?",
    "Safeties press down at ~6 yards depth in Cover 0 on early downs, then drop deep into Cover 4 quarters on passing downs."
  ],
  [
    "The primary quick-game RPO target for Providence Christian who leads the team in receiving yards is player #_____.",
    "#4"
  ],
  [
    "Outside linebacker #5 plays on the _____ edge and rarely drops into pass coverage.",
    "boundary"
  ],
  [
    "Outside linebacker #6 plays on the _____ edge and bumps out into space in Cover 4.",
    "field"
  ],
  [

    "6"
  ],
  [
    "What route types does Providence Christian throw most frequently to player #4 off RPOs?",
    "Bubbles, shoot routes, and slants near or behind the line of scrimmage."
  ],

    "The defensive line slants away from the jet action."
  ]

let order = cards.map((_, index) => index);
let position = 0;
let showingAnswer = false;

const card = document.getElementById("card");
const side = document.getElementById("side");
const text = document.getElementById("text");
const hint = document.getElementById("hint");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const flipButton = document.getElementById("flip");

function render() {
  const current = cards[order[position]];
  text.textContent = current[showingAnswer ? 1 : 0];
  side.textContent = showingAnswer ? "Answer" : "Question";
  hint.textContent = showingAnswer
    ? "Tap to view question"
    : "Tap to reveal answer";

  flipButton.textContent = showingAnswer
    ? "Show Question"
    : "Show Answer";

  card.classList.toggle("answer", showingAnswer);
  card.setAttribute(
    "aria-label",
    `${side.textContent}: ${text.textContent}. ${hint.textContent}.`
  );

  counter.textContent = `Card ${position + 1} of ${cards.length}`;
  progress.max = cards.length;
  progress.value = position + 1;
}

function flip() {
  showingAnswer = !showingAnswer;
  render();
}

function move(direction) {
  position = (position + direction + order.length) % order.length;
  showingAnswer = false;
  render();
}

card.addEventListener("click", flip);
flipButton.addEventListener("click", flip);

document.getElementById("previous").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));

document.getElementById("shuffle").addEventListener("click", () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  position = 0;
  showingAnswer = false;
  render();
});

document.getElementById("restart").addEventListener("click", () => {
  order = cards.map((_, index) => index);
  position = 0;
  showingAnswer = false;
  render();
});

document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.key === "ArrowLeft") {
    event.preventDefault();
    move(-1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    move(1);
  } else if (
    event.code === "Space" &&
    !["BUTTON", "INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)
  ) {
    event.preventDefault();
    flip();
  }
});

render();
</script>
</body>
</html>
