<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Christian Flashcards</title>
<style>
  :root {
    --navy: #0c3467;
    --cardinal: #c41e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f0f3f7;
    color: var(--navy);
    font-family: Georgia, serif;
  }
  header {
    padding: 30px 16px;
    text-align: center;
    color: white;
    background: var(--navy);
    border-bottom: 6px solid var(--cardinal);
  }
  header p { margin: 0 0 10px; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); }
  main {
    width: min(850px, 100%);
    margin: auto;
    padding: 24px 16px 40px;
  }
  .intro, .hint { text-align: center; }
  .counter { text-align: center; margin: 20px 0 10px; }
  .track {
    height: 8px;
    overflow: hidden;
    background: #dce2ea;
    border-radius: 20px;
    margin-bottom: 22px;
  }
  .fill { height: 100%; background: var(--cardinal); }
  .card {
    width: 100%;
    min-height: 310px;
    padding: 34px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: white;
    color: var(--navy);
    border: 0;
    border-top: 7px solid var(--navy);
    border-radius: 18px;
    box-shadow: 0 8px 28px #0c34671a;
    cursor: pointer;
    font-family: inherit;
  }
  .card.answer {
    border-top-color: var(--cardinal);
    background: var(--navy);
    color: white;
  }
  .label {
    font: bold 13px Arial, sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .text {
    font-size: clamp(21px, 3.5vw, 28px);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
  }
  .controls button {
    padding: 13px 20px;
    background: var(--navy);
    color: white;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font: bold 15px Georgia, serif;
  }
  .controls .primary { background: var(--cardinal); }
  .controls .secondary {
    background: white;
    color: var(--navy);
    border: 1px solid #c9d2df;
  }
  button:hover { filter: brightness(.94); }
  button:focus-visible {
    outline: 3px solid #e6a329;
    outline-offset: 4px;
  }
  .hint { font-size: 14px; color: #58677a; margin-top: 24px; }
  @media (max-width: 480px) {
    .card { padding: 28px 20px; min-height: 340px; }
    .controls button { padding: 12px 14px; }
  }
</style>
</head>
<body>
<header>
  <p>Montgomery Academy Football</p>
  <h1>Mobile Christian Flashcards</h1>
</header>

<main>
  <p class="intro">Study the opponent. Know the answer before you reveal it.</p>

  <p id="counter" class="counter" aria-live="polite"></p>
  <div class="track" role="progressbar" aria-label="Card position"
       aria-valuemin="1" id="progress">
    <div id="fill" class="fill"></div>
  </div>

  <button id="card" class="card" type="button"
          aria-label="Show answer" aria-pressed="false">
    <span id="label" class="label">Question</span>
    <span id="text" class="text"></span>
  </button>

  <div class="controls">
    <button id="previous" type="button">← Previous</button>
    <button id="reveal" class="primary" type="button">Show Answer</button>
    <button id="next" type="button">Next →</button>
  </div>

  <div class="controls">
    <button id="shuffle" class="secondary" type="button">Shuffle Cards</button>
    <button id="restart" class="secondary" type="button">Restart</button>
  </div>

  <p class="hint">
    Tap the card to flip · Space flips · Arrow keys move between cards
  </p>
</main>

  ],

    "Weak (away from Sam/Nickel #12)."
  ],
  [

    "They roll toward the passing strength to match the three receivers in Man Free."
  ],
  [
    "How does Mobile Christian's defense shift when facing 10-personnel Empty sets?",
    "They shift to a 3-man Mint front with DT #7 dropping back into coverage in drop-eight."
  ],
  [
    "What pre-snap motion is most frequently utilized by Mobile Christian's slot receivers?",
    "Slot receiver motion for jet-sweep actions and alignment shifts."
  ],
  [
    "How does Pistol backfield alignment dictate Mobile Christian's run concept?",
    "Power/ISO is run when the back aligns to the key, split zone when away from the key, and counter when aligned to it."
  ],
  [
    "What pass concept do Mobile Christian's bunch receiver formations frequently yield?",
    "Dig, seam, and shoot concepts."
  ]
];

let cards = original.slice();
let position = 0;
let showingAnswer = false;

const card = document.getElementById("card");
const label = document.getElementById("label");
const text = document.getElementById("text");
const counter = document.getElementById("counter");
const fill = document.getElementById("fill");
const progress = document.getElementById("progress");
const reveal = document.getElementById("reveal");

function render() {
  label.textContent = showingAnswer ? "Answer" : "Question";
  text.textContent = cards[position][showingAnswer ? 1 : 0];
  card.classList.toggle("answer", showingAnswer);
  card.setAttribute("aria-pressed", String(showingAnswer));
  card.setAttribute(
    "aria-label",
    showingAnswer ? "Show question" : "Show answer"
  );
  reveal.textContent = showingAnswer ? "Show Question" : "Show Answer";
  counter.textContent = `Card ${position + 1} of ${cards.length}`;
  fill.style.width = `${((position + 1) / cards.length) * 100}%`;
  progress.setAttribute("aria-valuemax", cards.length);
  progress.setAttribute("aria-valuenow", position + 1);
}

function flip() {
  showingAnswer = !showingAnswer;
  render();
}

function move(amount) {
  position = (position + amount + cards.length) % cards.length;
  showingAnswer = false;
  render();
}

card.addEventListener("click", flip);
reveal.addEventListener("click", flip);
document.getElementById("previous").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));

document.getElementById("shuffle").addEventListener("click", () => {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  position = 0;
  showingAnswer = false;
  render();
});

document.getElementById("restart").addEventListener("click", () => {
  cards = original.slice();
  position = 0;
  showingAnswer = false;
  render();
});

document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    move(-1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    move(1);
  } else if (
    event.code === "Space" &&
    !event.target.closest("button, input, textarea, select, a")
  ) {
    event.preventDefault();
    flip();
  }
});

render();
</script>
</body>
</html>
