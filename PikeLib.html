<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pike Lib Scouting Flashcards</title>

  <style>
    :root {
      --navy: #0c3467;
      --cardinal: #c41e3a;
      --ink: #122033;
      --muted: #667085;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: var(--ink);
      background: linear-gradient(145deg, #edf2f8, #fff 55%, #f8ecee);
    }

    .wrap {
      width: min(920px, calc(100% - 28px));
      margin: auto;
      padding: 34px 0 28px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: var(--cardinal);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .78rem;
    }

    h1 {
      margin: 8px 0 6px;
      color: var(--navy);
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    .sub {
      margin: 0;
      color: var(--muted);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 auto 14px;
      max-width: 760px;
    }

    .track {
      height: 9px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: #dce3ec;
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--navy), var(--cardinal));
      transition: width .25s ease;
    }

    .count {
      min-width: 74px;
      color: var(--navy);
      font-weight: 700;
      text-align: right;
    }

    .scene {
      max-width: 760px;
      height: 390px;
      margin: auto;
      perspective: 1200px;
      cursor: pointer;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2, .75, .25, 1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vw, 62px);
      border-radius: 22px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 18px 45px rgba(12, 52, 103, .18);
      text-align: center;
    }

    .front {
      color: var(--navy);
      background: #fff;
      border-top: 8px solid var(--cardinal);
    }

    .back {
      color: #fff;
      background: linear-gradient(145deg, var(--navy), #061d3d);
      border-top: 8px solid var(--cardinal);
      transform: rotateY(180deg);
    }

    .label {
      position: absolute;
      top: 24px;
      font: 700 .76rem Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
    }

    .text {
      margin: 0;
      font-size: clamp(1.25rem, 3.2vw, 2rem);
      line-height: 1.38;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      font: italic .88rem Georgia, serif;
      opacity: .58;
    }

    .controls, .tools {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .controls { margin-top: 18px; }
    .tools { margin-top: 12px; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: 700 .95rem Arial, sans-serif;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .primary {
      color: #fff;
      background: var(--cardinal);
    }

    .secondary {
      color: #fff;
      background: var(--navy);
    }

    .ghost {
      color: var(--navy);
      background: #fff;
      border: 1px solid #cfd8e4;
    }

    .shortcuts {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 600px) {
      .wrap { padding-top: 22px; }
      .scene { height: 430px; }
      .face { padding: 50px 24px 46px; }
      .controls button {
        flex: 1;
        min-width: 96px;
        padding: 12px 9px;
      }
      .tools button { padding: 10px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .fill, button { transition: none; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Montgomery Academy Football</div>
      <h1>Pike Lib Scouting Flashcards</h1>
      <p class="sub">
        Study the opponent. Know the answer before you reveal it.
      </p>
    </header>

    <div class="progress-row">
      <div class="track">
        <div class="fill" id="fill"></div>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div
      class="scene"
      id="scene"
      role="button"
      tabindex="0"
      aria-label="Flashcard. Select to reveal answer."
    >
      <div class="card" id="card">
        <section class="face front">
          <span class="label">Question</span>
          <p class="text" id="question"></p>
          <span class="hint">Click card or press Space to reveal</span>
        </section>

        <section class="face back">
          <span class="label">Answer</span>
          <p class="text" id="answer"></p>
          <span class="hint">Click card or press Space to return</span>
        </section>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" id="prev">← Previous</button>
      <button class="primary" id="reveal">Reveal Answer</button>
      <button class="secondary" id="next">Next →</button>
    </div>

    <div class="tools">
      <button class="ghost" id="shuffle">Shuffle Cards</button>
      <button class="ghost" id="restart">Restart</button>
    </div>

    <div class="shortcuts">
      Space flips · Arrow keys move between cards
    </div>
  </main>

  <script>

        "They show a Mint Bear look to pack the box while maintaining Cover 3 coverage behind it."

        "Double A-Gap Mug (walking both linebackers into the A-gaps and bringing them)."

        "They always show it pre-snap before bringing it, and they have NEVER been seen dropping out once shown."
      ],
      [
        "What is Pike Lib's primary coverage change-up in obvious passing situations?",
        "Dropping one outside linebacker into a Cover 4 shell."
      ],
      [

        "The cornerbacks and the boundary safety."
      ],
      [
        "How do DBs align pre-snap in Pike Lib's Cover 2 (Cut) scheme?",
        "Corners align up close looking directly at the QB; safeties face the #1 WR over the top."
      ],
      [
        "What pre-snap alignments characterize Pike Lib's standard Cover 3?",
        "Single high safety, boundary safety walked down into a 4-man box, and corners off and angled to the QB."
      ],
      [
        "What depth do cornerbacks play in Pike Lib's Cover 4 (Quarters) shell?",
        "Aligned at a depth of 6 to 7 yards."
      ],
      [
        "What perimeter passing attack has Pike Lib struggled to defend all season?",
        "Perimeter screens (bubbles/nows), which they defend poorly even after installing 'Cut' coverage."
      ],
      [
        "How can an offense exploit Corner #1 on perimeter pass concepts?",
        "Exploit Corner #1's reluctance to tackle to generate major run-after-catch (RAC) yards."
      ],
      [
        "What specific game plan recommendation is made regarding OLB #0 (6'2\", 175 lbs)?",
        "Attack the edge directly at him, as he is easily blocked and inefficient at setting the edge."
      ],
      [
        "What interior line matchup advantage should the offense exploit against Pike Lib's defense?",
        "Exploit their small, non-physical interior defensive line by controlling the line of scrimmage."
      ],
      [
        "Is defensive tempo counter-planning an explicit focus for this week's defensive preparation?",
        "No, tempo is NOT a specific point of emphasis for this week's game plan."
      ]
    ];

    let cards = [...original];
    let index = 0;
    let flipped = false;

    const el = id => document.getElementById(id);
    const card = el("card");

    function render() {
      flipped = false;
      card.classList.remove("flipped");

      el("question").textContent = cards[index][0];
      el("answer").textContent = cards[index][1];
      el("count").textContent = `${index + 1} / ${cards.length}`;
      el("fill").style.width = `${((index + 1) / cards.length) * 100}%`;
      el("reveal").textContent = "Reveal Answer";
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle("flipped", flipped);
      el("reveal").textContent =
        flipped ? "Show Question" : "Reveal Answer";
    }

    function move(amount) {
      index = (index + amount + cards.length) % cards.length;
      render();
    }

    el("scene").addEventListener("click", flip);
    el("reveal").addEventListener("click", flip);
    el("prev").addEventListener("click", () => move(-1));
    el("next").addEventListener("click", () => move(1));

    el("shuffle").addEventListener("click", () => {
      cards = [...cards];

      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }

      index = 0;
      render();
    });

    el("restart").addEventListener("click", () => {
      cards = [...original];
      index = 0;
      render();
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        flip();
      }

      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);

      if (event.key === "Enter" && event.target === el("scene")) {
        event.preventDefault();
        flip();
      }
    });

    render();
  </script>
</body>
</html>
