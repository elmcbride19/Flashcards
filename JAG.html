<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAG Scouting Flashcards</title>
  <style>
    :root { --navy:#0c3467; --cardinal:#c41e3a; --ink:#122033; --muted:#667085; --paper:#f5f7fb; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Georgia,serif; color:var(--ink); background:linear-gradient(145deg,#edf2f8,#fff 55%,#f8ecee); }
    .wrap { width:min(920px,calc(100% - 28px)); margin:auto; padding:34px 0 28px; }
    header { text-align:center; margin-bottom:24px; }
    .eyebrow { color:var(--cardinal); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.78rem; }
    h1 { margin:8px 0 6px; color:var(--navy); font-family:"Libre Baskerville",Georgia,serif; font-size:clamp(1.8rem,5vw,3rem); }
    .sub { margin:0; color:var(--muted); }
    .progress-row { display:flex; align-items:center; gap:14px; margin:0 auto 14px; max-width:760px; }
    .track { height:9px; flex:1; overflow:hidden; border-radius:999px; background:#dce3ec; }
    .fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--navy),var(--cardinal)); transition:width .25s ease; }
    .count { min-width:74px; color:var(--navy); font-weight:700; text-align:right; }
    .scene { max-width:760px; height:390px; margin:auto; perspective:1200px; cursor:pointer; }
    .card { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.75,.25,1); }
    .card.flipped { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(28px,6vw,62px); border-radius:22px; backface-visibility:hidden; box-shadow:0 18px 45px rgba(12,52,103,.18); text-align:center; }
    .front { color:var(--navy); background:var(--white); border-top:8px solid var(--cardinal); }
    .back { color:var(--white); background:linear-gradient(145deg,var(--navy),#061d3d); border-top:8px solid var(--cardinal); transform:rotateY(180deg); }
    .label { position:absolute; top:24px; font:700 .76rem Arial,sans-serif; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
    .text { margin:0; font-size:clamp(1.25rem,3.2vw,2rem); line-height:1.38; }
    .hint { position:absolute; bottom:22px; font:italic .88rem Georgia,serif; opacity:.58; }
    .controls,.tools { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
    .controls { margin-top:18px; }
    .tools { margin-top:12px; }
    button { border:0; border-radius:10px; padding:12px 18px; font:700 .95rem Arial,sans-serif; cursor:pointer; transition:transform .15s,filter .15s; }
    button:hover { transform:translateY(-1px); filter:brightness(1.05); }
    .primary { color:#fff; background:var(--cardinal); }
    .secondary { color:#fff; background:var(--navy); }
    .ghost { color:var(--navy); background:#fff; border:1px solid #cfd8e4; }
    .shortcuts { margin-top:18px; text-align:center; color:var(--muted); font-size:.85rem; }
    @media(max-width:600px){ .wrap{padding-top:22px}.scene{height:430px}.face{padding:50px 24px 46px}.controls button{flex:1;min-width:96px;padding:12px 9px}.tools button{padding:10px 14px} }
    @media(prefers-reduced-motion:reduce){ .card,.fill,button{transition:none} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Montgomery Academy Football</div>
      <h1>JAG Scouting Flashcards</h1>
      <p class="sub">Study the opponent. Know the answer before you reveal it.</p>
    </header>
    <div class="progress-row"><div class="track"><div class="fill" id="fill"></div></div><div class="count" id="count"></div></div>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Flashcard. Select to reveal answer.">
      <div class="card" id="card">
        <section class="face front"><span class="label">Question</span><p class="text" id="question"></p><span class="hint">Click card or press Space to reveal</span></section>
        <section class="face back"><span class="label">Answer</span><p class="text" id="answer"></p><span class="hint">Click card or press Space to return</span></section>
      </div>
    </div>
    <div class="controls">
      <button class="secondary" id="prev">← Previous</button>
      <button class="primary" id="reveal">Reveal Answer</button>
      <button class="secondary" id="next">Next →</button>
    </div>
    <div class="tools"><button class="ghost" id="shuffle">Shuffle Cards</button><button class="ghost" id="restart">Restart</button></div>
    <div class="shortcuts">Space flips · Arrow keys move between cards</div>
  </main>
  <script>
    const original = [
          [
                "Who are the top two leading scorers for the JAG offense?",
                "Players #3 and #1."
          ],
          [
                "Which three players are the leading receivers for JAG?",
                "Players #3, #14, and #2."
          ],
          [
                "What is the signal style used by the JAG offensive system?",
                "A no-huddle system that gets signals at the line of scrimmage."
          ],
          [
                "How frequently does the JAG offense utilize freeze or dummy calls per game?",
                "A couple of times per game to test the defense."
          ],
          [
                "What is the specific snap cadence utilized by the JAG quarterback?",
                "A rapid 'Clock' cadence where the ball is snapped quickly after the signal."
          ],
          [
                "What play is nearly 100% guaranteed when the JAG offense uses pre-snap orbit motion?",
                "A double pass."
          ],
          [
                "What is the primary purpose of the H-Back hop motion introduced against Opelika?",
                "To disguise the final alignment of the offense."
          ],
          [
                "In the JAG system, what does a running back motioning out of the backfield indicate?",
                "Likely Flare Screen"
          ],
          [
                "What is the specific play key when a backside Guard pulls from an unbalanced set?",
                "It is 100% a QB run."
          ],
          [
                "What is the primary role of the JAG player #3?",
                "Primary signal caller playing over 90% of snaps."
          ],
          [
                "How is the athleticism of QB #3 described in the scouting report?",
                "He is an insanely fast athlete whose play is never over."
          ],
          [
                "What personnel change occurs when JAG enters traditional passing packages with QB #15?",
                "QB #3 moves to the Wide Receiver position."
          ],
          [
                "What are the physical specifications for JAG's main running back (#1)?",
                "Estimated at 5'10″, 195 lbs."
          ],
          [
                "How is the running style of RB #1 characterized?",
                "A powerful downhill runner with elite speed who aggressively takes on LBs."
          ],
          [
                "Which two players are the primary wide receiver targets for JAG?",
                "Players #2 and #4."
          ],
          [
                "What percentage of fast, slow, and tunnel screens are directed to receivers #2 and #4?",
                "99% of all such screens."
          ],
          [
                "What are the physical specifications of the JAG Tight End personnel?",
                "A big, long frame measuring 6'4″ and weighing 240 lbs."
          ],
          [
                "What is the main blocking impact of the JAG Tight End?",
                "An effective run blocker due to sheer size and length."
          ],
          [
                "What are the physical specifications for the JAG Right Tackle (#70)?",
                "Massive and dominant anchor size at 6'6″ and 330 lbs."
          ],
          [
                "What is the primary weakness of the JAG pass protection regarding the pulling scheme?",
                "Susceptibility to interior gap penetration when Guards pull."
          ],
          [
                "Which JAG defensive tackle is identified as the best D-lineman with a physical presence?",
                "DT #55."
          ],
          [
                "What is the rotational role of JAG defensive tackle #98?",
                "A short, very large rotational interior player at 5'10″ and 305 lbs."
          ],
          [
                "Which JAG defensive end is described as a high-motor player who effectively chases down plays?",
                "DE #11."
          ],
          [
                "What is the fixed alignment tell for the JAG defensive ends?",
                "The DEs do not flip sides during the game."
          ],
          [
                "How is the playing style of the JAG Will Linebacker (#8) described?",
                "A very physical 'head hunter' searching for big hits."
          ],
          [
                "Which defensive gap does the JAG Will Linebacker typically attack during a blitz?",
                "The interior A or B gaps."
          ],
          [
                "What is the primary role of the JAG Mike Linebacker (#10)?",
                "Commanding the interior box and serving as the middle field communicator."
          ],
          [
                "What is a unique physical or team role of the JAG Sam Linebacker (#33)?",
                "He is a short, stockier player who serves as the long snapper."
          ],
          [
                "Under what condition does the JAG Sam Linebacker walk up as a 5th lineman?",
                "When facing specific offensive sets."
          ],
          [
                "Which JAG cornerback is the primary starter and perimeter corner?",
                "CB #7."
          ],
          [
                "What are the alignment tendencies of the JAG Boundary Safety (#9)?",
                "Aligns boundary, can be an aggressive run fitter, and plays up to 22 yards deep."
          ],
          [
                "How does the Field Safety (#6) compare to the Boundary Safety in coverage?",
                "He is considered a better coverage safety and consistently plays a deeper shell."
          ],
          [
                "What is the fatigue profile of the JAG starting defensive linemen?",
                "They are big and athletic but tire significantly as the game progresses."
          ],
          [
                "What is the base structure of the JAG defensive front?",
                "A 4-3 Over front, mixed with some Under front looks."
          ],
          [
                "How does the JAG defense adjust its 5-technique against H-back or TE sets?",
                "They expand the 5-technique outside and remove the Sam backer from the box."
          ],
          [
                "From which specific player does the primary JAG interior blitz pressure originate?",
                "Will Linebacker #8."
          ],
          [
                "What is the primary defensive coverage shell used by JAG?",
                "Cover 4 (Quarters)."
          ],
          [
                "To what coverage shell does JAG adjust when facing compressed offensive sets?",
                "Cover 3, by walking the Sam to the line of scrimmage and rolling safeties."
          ],
          [
                "Where is the major coverage vulnerability located in the JAG defensive shell?",
                "The middle of the field at 15 yards underneath deep safeties."
          ],
          [
                "What specific offensive route is recommended to exploit JAG's 15-yard MOF vulnerability?",
                "Dig routes."
          ],
          [
                "What tactical offensive concepts exploit JAG's deep safety alignment?",
                "Switch routes and out-breaking routes."
          ],
          [
                "Which offensive packages are explicitly noted to cause problems for the JAG defense?",
                "'Sugar' packages."
          ],
          [
                "What is the primary signal style of the JAG no-huddle offensive system?",
                "Getting signals at the line of scrimmage."
          ]
    ];
    let cards=[...original], index=0, flipped=false;
    const el=id=>document.getElementById(id), card=el('card');
    function render(){ flipped=false; card.classList.remove('flipped'); el('question').textContent=cards[index][0]; el('answer').textContent=cards[index][1]; el('count').textContent=`${index+1} / ${cards.length}`; el('fill').style.width=`${((index+1)/cards.length)*100}%`; el('reveal').textContent='Reveal Answer'; }
    function flip(){ flipped=!flipped; card.classList.toggle('flipped',flipped); el('reveal').textContent=flipped?'Show Question':'Reveal Answer'; }
    function move(n){ index=(index+n+cards.length)%cards.length; render(); }
    el('scene').addEventListener('click',flip); el('reveal').addEventListener('click',flip); el('prev').addEventListener('click',()=>move(-1)); el('next').addEventListener('click',()=>move(1));
    el('shuffle').addEventListener('click',()=>{ cards=[...cards].sort(()=>Math.random()-.5); index=0; render(); });
    el('restart').addEventListener('click',()=>{ cards=[...original]; index=0; render(); });
    document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();flip();} if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); });
    render();
  </script>
</body>
</html>
