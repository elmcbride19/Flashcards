<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayside Scouting Flashcards</title>
  <style>
    :root { --navy: #0c3467; --cardinal: #c41e3a; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: #122033;
      background: linear-gradient(145deg, #edf2f8, #fff 55%, #f8ecee);
    }
    main { width: min(920px, calc(100% - 28px)); margin: auto; padding: 34px 0 28px; }
    header { text-align: center; margin-bottom: 24px; }
    .eyebrow {
      color: var(--cardinal);
      font-weight: bold;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .78rem;
    }
    h1 {
      margin: 8px 0 6px;
      color: var(--navy);
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }
    .sub, .shortcuts { color: #667085; }
    .progress { display: flex; align-items: center; gap: 14px; max-width: 760px; margin: 0 auto 14px; }
    .track { height: 9px; flex: 1; border-radius: 99px; background: #dce3ec; overflow: hidden; }
    #fill { height: 100%; background: linear-gradient(90deg, var(--navy), var(--cardinal)); transition: width .25s; }
    #count { min-width: 74px; text-align: right; color: var(--navy); font-weight: bold; }
    .scene { max-width: 760px; height: 430px; margin: auto; perspective: 1200px; cursor: pointer; }
    .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s; }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 58px 35px;
      border-radius: 22px;
      backface-visibility: hidden;
      box-shadow: 0 18px 45px #0c34672e;
      text-align: center;
      border-top: 8px solid var(--cardinal);
    }
    .front { color: var(--navy); background: white; }
    .back { color: white; background: linear-gradient(145deg, var(--navy), #061d3d); transform: rotateY(180deg); }
    .label {
      position: absolute;
      top: 24px;
      font: 700 .76rem Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
    }
    .text { margin: 0; font-size: clamp(1.1rem, 2.8vw, 1.8rem); line-height: 1.38; max-height: 100%; overflow: auto; }
    .hint { position: absolute; bottom: 22px; font: italic .88rem Georgia, serif; opacity: .58; }
    .controls, .tools { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .tools { margin-top: 12px; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; font: 700 .95rem Arial, sans-serif; cursor: pointer; }
    .primary { color: white; background: var(--cardinal); }
    .secondary { color: white; background: var(--navy); }
    .ghost { color: var(--navy); background: white; border: 1px solid #cfd8e4; }
    .shortcuts { text-align: center; font-size: .85rem; margin-top: 18px; }
    :focus-visible { outline: 3px solid var(--cardinal); outline-offset: 4px; }
    @media (max-width: 600px) {
      main { padding-top: 22px; }
      .scene { height: 470px; }
      .face { padding: 50px 24px 46px; }
      .controls button { flex: 1; min-width: 96px; padding: 12px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, #fill { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Montgomery Academy Football</div>
      <h1>Bayside Scouting Flashcards</h1>
      <p class="sub">Study the opponent. Know the answer before you reveal it.</p>
    </header>

    <div class="progress">
      <div class="track"><div id="fill"></div></div>
      <div id="count"></div>
    </div>

    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Flashcard. Select to reveal answer.">
      <div class="card" id="card">
        <section class="face front">
          <span class="label">Question</span>
          <p class="text" id="question"></p>
          <span class="hint">Click card or press Space to reveal</span>
        </section>
        <section class="face back">
          <span class="label">Answer</span>
          <p class="text" id="answer"></p>
          <span class="hint">Click card or press Space to return</span>
        </section>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" id="prev">← Previous</button>
      <button class="primary" id="reveal">Reveal Answer</button>
      <button class="secondary" id="next">Next →</button>
    </div>
    <div class="tools">
      <button class="ghost" id="shuffle">Shuffle Cards</button>
      <button class="ghost" id="restart">Restart</button>
    </div>
    <div class="shortcuts">Space flips · Arrow keys move between cards</div>
  </main>

  <script>
    const original = [
      [
        "What pre-snap offensive line giveaway indicates a gap-scheme run call?",
        "Condensed interior guard and center splits (narrowed down from standard two-foot splits)."
      ],
      [
        "How does Bayside's offense utilize short bursts of tempo after a big play?",
        "They align quickly in an overloaded formation and execute a toss or pass to the boundary."
      ],
      [
        "What is the tactical purpose of Bayside's frequent 'check-with-me' pre-snap signal mechanics?",
        "To shorten the game and control the clock by checking plays at the line of scrimmage."
      ],
      [
        "What cadence does Bayside's offense employ to try drawing defenders offsides?",
        "A standard clap cadence without major variations."
      ],
      [
        "Bayside's run scheme evolved away from split-zone concepts toward which primary gap-scheme runs?",
        "Guard-pull power, ISO, and dart gap-scheme runs."
      ],
      [
        "How long does Bayside's quarterback typically work the pocket before initiating an escape?",
        "Approximately 3 seconds."
      ],
      [
        "What is the directional pre-snap tendency for Bayside's slow screens?",
        "They are directed predominantly to the offense's left."
      ],
      [
        "What specific escape pattern does Bayside's quarterback execute when under pocket pressure?",
        "He steps up in the pocket and rolls out to his right."
      ],
      [
        "What pass rush strategy is most effective at disrupting Bayside's QB efficiency?",
        "Sustained four-man pressure, as the QB is vulnerable under contact."
      ],
      [
        "Which player serves as Bayside's primary downhill running back handling core rushing loads?",
        "RB #4."
      ],
      [
        "Which backfield player acts as Bayside's primary vertical receiving threat?",
        "RB #10 (nearly 40 catches, demanding downfield coverage attention)."
      ],
      [
        "What is the primary role of RB #2 in Bayside's offense?",
        "Depth running back used sparingly in a reserve role."
      ],
      [
        "Who is Bayside's primary boundary wide receiver target?",
        "WR #1 (700+ receiving yards; strong on isolation and deep routes)."
      ],
      [
        "What defensive alert should be called if WR #1 does not align to the boundary?",
        "Alert an alignment shift, as WR #1's alignments are field/boundary-specific."
      ],
      [
        "Which wide receiver leads Bayside in receiving yardage and targets in short space?",
        "WR #13 (quick on bubbles, outs, and sticks)."
      ],
      [
        "What route concept profile defines WR #14's primary effectiveness?",
        "Effective on deep posts and crossers, but exhibits limited body control on jump balls."
      ],
      [
        "What is the main physical profile weakness of Bayside's wide receiver unit?",
        "Reluctant blockers who avoid physical contact and seek pass-interference calls."
      ],
      [
        "What defensive tactical priority targets Bayside's receiver unit?",
        "Force perimeter receivers to block in space and contest WR #1 boundary isolations."
      ],
      [
        "How does TE/H-Back #11 allow Bayside's offense to flex between 11 and 12 personnel looks?",
        "By utilizing dual-alignment flexibility (aligning attached or split out without personnel substitutions)."
      ],
      [
        "What run threat does TE/H-Back #11 present from an H-back alignment?",
        "Ball carrier on counter-pitch concepts."
      ],
      [
        "Which two offensive linemen represent the primary pass protection weaknesses in 50 protection?",
        "Left Guard #71 and Right Guard #78."
      ],
      [
        "What movement limitation impairs Left Guard #71's effectiveness on pulling schemes?",
        "He is the least mobile lineman and struggles when pulling."
      ],
      [
        "Which player anchors Bayside's interior offensive line?",
        "Center #64 (solid at blocking back)."
      ],
      [
        "What key traits distinguish utility lineman #57 when filling in at tackle or guard?",
        "He plays faster and more aggressively than the starters."
      ],
      [
        "What movement trait defines Bayside's starting offensive tackle play?",
        "Lighter and quicker movement traits."
      ],
      [
        "How can a defensive front best exploit the overall physical profile of Bayside's offensive line?",
        "Attack with a four-man rush to exploit their overall lack of physicality and generate consistent pocket pressure."
      ],
      [
        "What protection adjustments does Bayside's offense use to assist their line against heavy pressure?",
        "Slide protection paired with H-back or running back protection assistance."
      ],
      [
        "Which interior defensive lineman must be explicitly accounted for in protection plans?",
        "DT #54 (primary interior starter with strong hand placement and point-of-attack disruption)."
      ],
      [
        "What gap-shifting mechanics does DL #5 use in Bayside's 3-man stack front?",
        "He moves across gaps behind the nose (often tracking the H-back) rather than aligning static."
      ],
      [
        "Who forms Bayside's primary interior defensive line starting pairing?",
        "DT #54 and DT #64."
      ],
      [
        "What is the primary alignment role of DE #11 on Bayside's defense?",
        "Field 5-technique edge starter (who also starts on offense)."
      ],
      [
        "How is DE #57 utilized in Bayside's defensive line rotation?",
        "Rotates between interior tackle, 5-technique edge, and boundary end."
      ],
      [
        "What are Bayside's primary base defensive front alignments?",
        "Nickel Over front (shaded to boundary) and 3-man Stack / Mint alignment."
      ],
      [
        "What secondary defensive front looks does Bayside present situationally?",
        "Under, Mint Wide, Nickel G, and double-three technique fronts."
      ],
      [
        "What late pre-snap front shift should the offense alert for against Bayside?",
        "Pre-snap shifts moving from double-A gap looks out to a double-three front."
      ],
      [
        "How does Bayside's interior pass rush impact pocket protection?",
        "It compresses the pocket inside, requiring guards to control 3-technique penetration."
      ],
      [
        "Who is identified as Bayside's defensive alpha and primary tackle-maker?",
        "Field ILB #4 (who also plays starting running back)."
      ],
      [
        "Why should an offense test boundary ILB #23 with run fits and pursuit?",
        "He is a younger, smaller defender with less tackle impact than ILB #4."
      ],
      [
        "What is the alignment and blitz frequency of Sam LB #2?",
        "Aligns to the field as an overhang defender and rarely blitzes off the edge."
      ],
      [
        "How does Sam LB #2 adjust pre-snap when a slot receiver motions outward?",
        "He bumps wider to match the outward receiver motion."
      ],
      [
        "How can an offense exploit Sam LB #2's motion adjustment?",
        "Use pre-snap receiver motion to widen Sam #2 and open interior voids."
      ],
      [
        "What primary coverage shell structure does Bayside's secondary employ?",
        "Mod-based, zone-eyes coverage (does NOT pattern-match)."
      ],
      [
        "What position group represents the primary tackling weakness in Bayside's secondary?",
        "Cornerbacks (#12, #22)."
      ],
      [
        "How do Bayside's safeties compare to their cornerbacks in tackling reliability?",
        "Safeties (#3, #10) provide stronger, more reliable tackle support than the corners."
      ],
      [
        "How does Bayside's defense cover isolated featured receivers?",
        "They assign bracket help rather than having a single corner track the receiver across formations."
      ],
      [
        "What passing concept best exploits Bayside's cornerbacks' tackling weakness?",
        "Immediate perimeter screens (now/fast screens) that force corners to tackle in space."
      ],
      [
        "What coverage changeups does Bayside's secondary present to alter coverage pictures?",
        "Cut and Rob coverage calls."
      ],
      [
        "What coverage structure does Bayside use when Cornerback #22 is isolated against top targets?",
        "Bracket help or safety support over the top."
      ],
      [
        "What is the main coverage and tackling profile of Cornerback #12?",
        "Top cover corner on the squad, but vulnerable when tackling in space."
      ],
      [
        "What is the defensive role of reserve defensive back #9?",
        "Versatile reserve corner and multi-position secondary player."
      ],
      [
        "What secondary rotation occurs when Safety #1 enters the game?",
        "Safety #1 plays safety, allowing Safety #10 to flex out to corner."
      ],
      [
        "What are the primary alignment and defensive traits of Safety #3?",
        "Aligns to the boundary as a solid defender and a better tackler than the corners."
      ],
      [
        "What is the strategic goal of operating a sustained tempo offense against Bayside?",
        "Exhaust two-way starters (#54, #11, #4, #10) and stress their defensive line rotation across four quarters."
      ],
      [
        "What operational framework is recommended for maintaining fast tempo execution?",
        "A streamlined 4-play tempo menu."
      ],
      [
        "Why is Bayside's defense particularly susceptible to 2nd-half physical fatigue from tempo?",
        "They rely on core starters playing two ways following high-snap defensive outings."
      ],
      [
        "What technique do Bayside's edge defenders use against kickout blocks on pulling run schemes?",
        "Wrong-shoulder technique, turning their outside shoulder into kickout blocks (requiring pullers to log outside)."
      ],
      [
        "What pre-snap/post-snap read allows the quarterback to pull and run on RPO/GPO calls?",
        "Reading the backside edge defender; if he squeezes hard, the QB has freedom to pull and run out the backside."
      ],
      [
        "How can defensive pressure exploit LG #71 and RG #78 in Bayside's 50 pass protection?",
        "Attack the interior with a 4-man pressure, as LG #71 and RG #78 are identified as the weakest pass protectors."
      ]
    ];

    let cards = [...original];
    let index = 0;
    let flipped = false;

    const el = id => document.getElementById(id);
    const card = el('card');

    function render() {
      flipped = false;
      card.classList.remove('flipped');
      el('question').textContent = cards[index][0];
      el('answer').textContent = cards[index][1];
      el('count').textContent = `${index + 1} / ${cards.length}`;
      el('fill').style.width = `${(index + 1) / cards.length * 100}%`;
      el('reveal').textContent = 'Reveal Answer';
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle('flipped', flipped);
      el('reveal').textContent = flipped ? 'Show Question' : 'Reveal Answer';
    }

    function move(direction) {
      index = (index + direction + cards.length) % cards.length;
      render();
    }

    el('scene').onclick = flip;
    el('reveal').onclick = flip;
    el('prev').onclick = () => move(-1);
    el('next').onclick = () => move(1);

    el('shuffle').onclick = () => {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      index = 0;
      render();
    };

    el('restart').onclick = () => {
      cards = [...original];
      index = 0;
      render();
    };

    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && event.target.tagName !== 'BUTTON') {
        event.preventDefault();
        flip();
      }
      if (event.key === 'Enter' && event.target === el('scene')) {
        event.preventDefault();
        flip();
      }
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });

    render();
  </script>
</body>
</html>
