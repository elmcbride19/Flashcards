<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fort Dale Scouting Flashcards</title>
  <style>
    :root {
      --navy: #0c3467;
      --cardinal: #c41e3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: #122033;
      background: linear-gradient(145deg, #edf2f8, #fff 55%, #f8ecee);
    }

    main {
      width: min(920px, calc(100% - 28px));
      margin: auto;
      padding: 34px 0 28px;
    }

    header { text-align: center; margin-bottom: 24px; }

    .eyebrow {
      color: var(--cardinal);
      font-weight: bold;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .78rem;
    }

    h1 {
      margin: 8px 0 6px;
      color: var(--navy);
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    .sub, .shortcuts { color: #667085; }

    .progress {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 760px;
      margin: 0 auto 14px;
    }

    .track {
      height: 9px;
      flex: 1;
      border-radius: 99px;
      background: #dce3ec;
      overflow: hidden;
    }

    #fill {
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--cardinal));
      transition: width .25s;
    }

    #count {
      min-width: 74px;
      text-align: right;
      color: var(--navy);
      font-weight: bold;
    }

    .scene {
      max-width: 760px;
      height: 430px;
      margin: auto;
      perspective: 1200px;
      cursor: pointer;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s;
    }

    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 58px 35px;
      border-radius: 22px;
      backface-visibility: hidden;
      box-shadow: 0 18px 45px #0c34672e;
      text-align: center;
      border-top: 8px solid var(--cardinal);
    }

    .front { color: var(--navy); background: white; }

    .back {
      color: white;
      background: linear-gradient(145deg, var(--navy), #061d3d);
      transform: rotateY(180deg);
    }

    .label {
      position: absolute;
      top: 24px;
      font: 700 .76rem Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
    }

    .text {
      margin: 0;
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
      line-height: 1.38;
      max-height: 100%;
      overflow: auto;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      font: italic .88rem Georgia, serif;
      opacity: .58;
    }

    .controls, .tools {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .tools { margin-top: 12px; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: 700 .95rem Arial, sans-serif;
      cursor: pointer;
    }

    .primary { color: white; background: var(--cardinal); }
    .secondary { color: white; background: var(--navy); }
    .ghost {
      color: var(--navy);
      background: white;
      border: 1px solid #cfd8e4;
    }

    .shortcuts {
      text-align: center;
      font-size: .85rem;
      margin-top: 18px;
    }

    :focus-visible {
      outline: 3px solid var(--cardinal);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      main { padding-top: 22px; }
      .scene { height: 470px; }
      .face { padding: 50px 24px 46px; }
      .controls button {
        flex: 1;
        min-width: 96px;
        padding: 12px 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, #fill { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Montgomery Academy Football</div>
      <h1>Fort Dale Scouting Flashcards</h1>
      <p class="sub">Study the opponent. Know the answer before you reveal it.</p>
    </header>

    <div class="progress">
      <div class="track"><div id="fill"></div></div>
      <div id="count"></div>
    </div>

    <div class="scene" id="scene" role="button" tabindex="0"
         aria-label="Flashcard. Select to reveal answer.">
      <div class="card" id="card">
        <section class="face front">
          <span class="label">Question</span>
          <p class="text" id="question"></p>
          <span class="hint">Click card or press Space to reveal</span>
        </section>
        <section class="face back">
          <span class="label">Answer</span>
          <p class="text" id="answer"></p>
          <span class="hint">Click card or press Space to return</span>
        </section>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" id="prev">← Previous</button>
      <button class="primary" id="reveal">Reveal Answer</button>
      <button class="secondary" id="next">Next →</button>
    </div>

    <div class="tools">
      <button class="ghost" id="shuffle">Shuffle Cards</button>
      <button class="ghost" id="restart">Restart</button>
    </div>

    <div class="shortcuts">Space flips · Arrow keys move between cards</div>
  </main>

  <script>
    const original = [
      ["What is Fort Dale's primary pace of play and operational cadence on offense?", "They operate a majority no-huddle offense with minimal downtime between snaps, using a basic single-clap cadence where snaps are anticipated on the first sound."],
      ["What sideline signal and alignment mechanics does Fort Dale's offense utilize?", "They align immediately following sideline signals without using a traditional huddle."],
      ["What are Fort Dale's base offensive alignment and backfield structure?", "Twins (2 × 2) base alignment with H-back usage, shifting into pistol sets for zone-read and zone-triple packages."],
      ["How does Fort Dale use pre-snap motion to influence defensive fits?", "They frequently use fly/jet motion to key counter runs and influence fits, along with backside H-back arc/swipe motions in read concepts."],
      ["What concepts define Fort Dale's core offensive run game identity?", "A heavy gap-scheme foundation (counter, buck sweep) featuring down blocks, alongside zone read, Q-counter, and zone triple when QB #7 is active."],
      ["What are Fort Dale's primary passing game tendencies and pass protection limitations?", "They run limited true dropback passing, favoring 80/90 sprint-out concepts where offensive tackles frequently fail to reach required depth landmarks."],
      ["What is Fort Dale's specific offensive tendency on 3rd-and-long situations?", "They call clear-out route combinations designed to vacate downfield coverage space, creating scrambling lanes for QB #7 with minimal play-action."],
      ["What is the primary source of explosive plays for Fort Dale's offense?", "QB scrambles on obvious passing downs and RB #33 finding downhill creases."],
      ["Fort Dale's offensive sprint-out protection relies on a backside _____ technique.", "gap-edge waterfall"],
      ["What is the scouting evaluation profile of Fort Dale's QB #7?", "Senior dual-threat quarterback; rated Passing Overall B, Efficiency B-, Experience A. He is their most dynamic playmaker in space and dangerous off-script."],
      ["What are the throwing characteristics and preferences of QB #7?", "Serviceable arm strength; prefers scramble/drift throws over tight-window timing throws, and pushes the ball deep on 3rd-and-long clear-outs."],
      ["What designed run concepts are featured when QB #7 is active?", "Q-counter, zone-read keep, and zone-triple options, attacking the perimeter whenever defenders lose edge containment."],
      ["How does QB #7 react to pocket pressure?", "He is sudden and quick to bail out of the pocket when lanes open, while keeping his eyes downfield during scrambles."],
      ["What is the scouting profile and physical description of RB #33?", "Sophomore featured running back (5'9\", 147 lbs); rated Rushing Overall C+, Efficiency B-, Experience C. He plays with an aggressive, downhill mentality despite a lighter frame."],
      ["What is RB #33's role in pass protection and the receiving game?", "Decent, willing, and assignment-sound in pass protection for his age, but has very limited usage as a pass catcher (Receptions: N/A)."],
      ["Which players occasionally rotate with RB #33 in short-yardage situations?", "Players #1 and #0, who share a similar lightweight frame and size profile."],
      ["What are the physical dimensions and deployment of wide receiver #12?", "6'1\", 180 lbs Senior; Fort Dale's largest wideout. Versatile alignment across H, slot, and split wideout, offering the largest catch radius on the perimeter."],
      ["What are the physical profiles and roles of wide receivers #6 and #11?", "#6 (5'9\", 115 lbs Jr) is a high-effort slot/twins receiver with limited strength. #11 (5'11\", 150 lbs So) is concept-savvy and rotates across slot and split positions in a similar role."],
      ["What is the primary tactical responsibility of Fort Dale's wide receiver unit as a whole?", "Running deep clear-out routes on 3rd down to open scramble space for QB #7; functional effort blockers who struggle to displace larger DBs."],
      ["What are the physical dimensions and roles of H-backs #18 and #2?", "#18 (5'7\", 145 lbs) and #2 (5'10\", 162 lbs Sr) are undersized effort blockers used in pre-snap arc/swipe motions and insert blocking roles."],
      ["What makes player #4 distinct within Fort Dale's tight end / H-back group?", "At ~ 6'2\" (190 lbs, Jr), he is their true TE with the best inline presence, providing crucial blocking size on the edge in gap schemes."],
      ["How is the pass-catching threat of Fort Dale's TE/H-back unit described?", "Concept-aware and interchangeable on flats and seams off play-action, but lacking the athleticism to create explosive separation."],
      ["What is the starting offensive line personnel from Left Tackle to Right Tackle for Fort Dale?", "LT #77 (6'2\", 195 Jr), LG #52 (5'10\", 170 Jr), C #60 (6'0\", 185), RG #50 (6'1\", 210, LS), RT #54 (6'1\", 205 Jr)."],
      ["What stance and split tendencies does Fort Dale's offensive line demonstrate?", "Predominantly 2-point stances across the entire line (including guards) with standard to slightly narrow splits."],
      ["How do Fort Dale's offensive linemen adjust their stance in pass protection, and what is the drawback?", "Their stances narrow further in pass sets; maintaining a 2-point stance limits their anchor ability against power pass rushers."],
      ["Which offensive line positions are featured in Fort Dale's gap run schemes and protection?", "Tackles #77 and #54 are heavily featured and represent their most effective run blockers, with no frequent side swapping."],
      ["What key vulnerability affects Fort Dale's offensive line when facing down-block assignments?", "They rely heavily on down blocks but struggle to sustain them or adjust to defensive line movement and penetration by bigger, aggressive DLs."],
      ["Why is Fort Dale's offensive line severely restricted in short-yardage situations?", "Their narrow stances and universal 2-point stance lack 3-point drive, severely limiting forward push and pad level."],
      ["What is the critical defensive rush rule required when playing against Fort Dale's offensive line and QB #7?", "Maintain disciplined rush lanes; do not over-rush upfield. Collapse the pocket while keeping edge lanes sealed so QB #7 cannot create scramble chaos."],
      ["What defensive interior personnel does Fort Dale utilize, and what is their playing style?", "#54 (6'1\", 205 lbs Jr), #55 (5'6\", 210 lbs So), and #77 (6'2\", 195 lbs Jr). They rotate multiple lightweight interior players relying on quick movement rather than holding two gaps."],
      ["How does Fort Dale pair its interior defensive line in their base front alignment?", "They pair a lightweight nose guard with an inside linebacker stacked directly behind the nose."],
      ["Who are Fort Dale's primary 5-technique defensive ends, and how are they deployed?", "#4 (6'2\", 190 lbs Jr) and #33 (5'9\", 127 lbs So) start at DE in base looks and double as stack linebackers. #12 (6'0\", 180 lbs Sr safety) flexes down to DE in nickel looks."],
      ["What major flaw do Fort Dale's defensive ends exhibit on film?", "They are undisciplined, lack containment discipline, and routinely chase plays upfield into the backfield rather than boxing plays inside."],
      ["What offensive play concepts best exploit Fort Dale's defensive ends?", "Off-tackle runs, perimeter sweeps, bootlegs, and edge screens that capitalize on over-pursuing, non-containing edge defenders."],
      ["What are the physical profiles and roles of Fort Dale's outside linebackers?", "#1 (5'9\", 155 lbs Sr; also plays safety) and #18 (5'6\", 138 lbs; downhill player). Both lack prototypical mass setting the edge against heavy blocking packages."],
      ["What weakness occurs when Fort Dale's outside linebackers drop into pass coverage?", "They drop into coverage in change-up packages but are frequently out-leveraged in open space by skill players."],
      ["Who starts at inside linebacker for Fort Dale, and what is their blitz tendency?", "#52 (5'10\", 170 lbs Jr) and #2 (5'10\", 162 lbs Sr). They are hyper-aggressive inside blitzers who frequently send both ILBs regardless of the front structure."],
      ["How can an offense exploit Fort Dale's dual-inside-linebacker blitzes?", "By attacking the second level with quick slants, TE drag routes, cutback runs, and middle screen passes that exploit the vacated linebacker zone."],
      ["What technique does primary corner #7 (6'1\", 168 lbs Sr) execute on the backside of 3 × 1 formations?", "'Meg Zero' (locked man-to-man coverage) against the isolated backside single receiver."],
      ["How extensive is Fort Dale's cornerback rotation?", "They use a deep rotation of at least six players at CB, including #7 (Sr), #0 (Jr), #5 (So), #6 (Jr), and #9."],
      ["Which key defensive back plays a hybrid role between starting Safety and 5-technique DE?", "#12 (6'0\", 180 lbs Sr), who starts at safety but moves down to defensive end in nickel packages."],
      ["What is the aggressive run-fit action of Fort Dale's backside safety in split-safety looks?", "The backside safety aggressively rolls down to 7 yards depth to insert directly into the box against the run."],
      ["What defensive breakdown occurs due to Fort Dale shuffling DBs across multiple hybrid positions?", "It causes frequent pre-snap communication breakdowns, coverage confusion, and alignment busts when handling motion or tempo."],
      ["What key weakness did film study reveal regarding Fort Dale's defense when facing tempo (e.g., vs ACA)?", "They struggle significantly to communicate, align, or execute secondary checks against rapid offensive tempo and pre-snap formation shifts."],
      ["Why does fast offensive tempo prevent Fort Dale from making defensive substitutions?", "Because multiple defenders play hybrid multi-position roles (#12 safety/DE, #4/#33 DE/stack LB, #2 LB/safety), rapid tempo locks them in sub-optimal alignments."],
      ["What is the primary offensive game plan tactic to exploit Fort Dale's alignment lag?", "Snap the ball quickly before stacked linebackers can declare their run gaps or before safeties can complete their 7-yard down-rolls."],
      ["How does sustained offensive tempo impact Fort Dale's front seven over the course of a drive?", "It gases their two-way starters and undersized interior linemen, wearing down their physical resistance."],
      ["What is Fort Dale's base defensive front alignment?", "'Mint Tite' front, featuring a line-of-scrimmage nose guard with a linebacker stacked directly behind him."],
      ["How is Fort Dale's stack front look structurally unique compared to typical teams?", "They stack an actual linebacker (#33 or #4) behind the nose rather than a defensive lineman, creating an unorthodox 6-man box look."],
      ["How does Fort Dale adjust its front alignment when facing spread offensive formations?", "They shift to a Nickel front (typically Over or Even front), while rarely showing an Under front."],
      ["What is the primary identity and philosophy of Fort Dale's defensive front design?", "A run-obsessed identity designed to clog interior A/B gaps and stop inside runs at all costs."],
      ["What coverage shell serves as Fort Dale's primary base pass defense across most downs?", "Single-high Cover 3 structure."],
      ["How does Fort Dale structure its defensive coverage shell against 3 × 1 formations?", "They execute split-field coverage: Cover 4 to the 3-receiver strong side, while the backside corner plays 'Meg Zero' on the single receiver."],
      ["When does Fort Dale typically deploy a true Cover 4 coverage shell?", "Sparingly, reserving true Cover 4 almost exclusively for obvious long-yardage passing downs."],
      ["What intermediate passing passing voids are created by Fort Dale's base Cover 3 shell?", "Deep seam gaps and intermediate sideline holes suitable for vertical routes, curls, and flood pass concepts."],
      ["How can an offense exploit Fort Dale's backside safety rolling down to 7 yards against the run?", "By faking the run and attacking the vacated deep middle area with play-action post and dig routes directly behind the rolling safety."],
      ["What matchup advantage exists on the backside of 3 × 1 sets against Fort Dale?", "Isolating a top playmaker receiver on the backside single receiver position against the corner locked in 'Meg Zero' man-to-man."],
      ["What general passing game strategy exploits Fort Dale's run-obsessed defense?", "Throwing over the top off aggressive run action and catching their retreating secondary with perimeter screen passes."],
      ["In Fort Dale's offensive line lineup, which player doubles as the team's long snapper?", "Right Guard #50 (6'1\", 210 lbs)."],
      ["What is the physical description of Center #60 on Fort Dale's offensive line?", "6'0\", 185 lbs."],
      ["What is the physical profile of starting Left Guard #52?", "5'10\", 170 lbs Junior."],
      ["What are the physical profiles of starting Tackles #77 and #54?", "LT #77 is 6'2\", 195 lbs Junior. RT #54 is 6'1\", 205 lbs Junior."],
      ["How does Fort Dale's offensive line perform in off-tackle run schemes?", "They demonstrate cohesive execution on off-tackle Power and Counter, with tackles #77 and #54 contributing effectively."],
      ["What is Fort Dale's offensive line unit profile summary?", "An experienced and mature starting group that is physically undersized and light across the entire front."],
      ["How do Fort Dale's wide receivers perform as perimeter blockers?", "They exhibit functional effort but struggle physically to displace larger defensive backs due to their lightweight frames."],
      ["What role does H-back #18 play in pre-snap operational structures?", "Key participant in pre-snap motion, fly action, insert blocking, and arc/swipe read structures."],
      ["What physical trait limits the effectiveness of Fort Dale's H-back group during run blocking?", "A lack of physical mass (#18 at 145 lbs, #2 at 162 lbs), which limits their power against disciplined edge defenders."],
      ["What scouting grade is assigned to QB #7's running ability?", "He is evaluated as the team's most dynamic offensive threat and playmaker in space, excelling on designed Q-runs and off-script scrambles."],
      ["What passing style does QB #7 favor over tight-window rhythm passes?", "Scramble and drift throws while moving outside the pocket."],
      ["What is the primary strength of RB #33 when running between the tackles?", "He hits the hole fast with urgency, maintaining a hard, downhill mentality."],
      ["What athletic trait is noted for RB #33 on film?", "Average top-end athleticism, but highlighted by a high motor and outstanding effort."],
      ["Which defensive lineman for Fort Dale is listed at 5'6\", 210 lbs as a sophomore?", "Interior rotational player #55."],
      ["Which interior defensive lineman for Fort Dale rotates inside specifically to simulate tight-end alignment looks?", "Player #77 (6'2\", 195 lbs Jr)."],
      ["Which player serves as the starter at defensive end and primary stack linebacker at 5'9\", 127 lbs?", "Sophomore defender #33."],
      ["Which defender serves as Fort Dale's 6'2\", 190 lbs 5-technique end who also shifts into the box as a stack LB?", "Junior defender #4."],
      ["What physical trait defines outside linebacker #18 (5'6\", 138 lbs) on film?", "He plays significantly bigger than his listed size as an active, aggressive downhill defender."],
      ["What multi-position versatility is noted for senior defender #2 (5'10\", 162 lbs)?", "Listed as #2/53 (suggesting OL play), he plays inside linebacker, safety, and contributes as a two-way player."],
      ["What is the height and weight profile of starting senior Cornerback #7?", "6'1\", 168 lbs."],
      ["What role does senior #1 (5'9\", 155 lbs) play in Fort Dale's defense?", "Starting safety / outside linebacker hybrid who rolls down into the box or triggers off the edge from split-safety alignments."],
      ["What impact do pre-snap shifts and motion have on Fort Dale's secondary?", "They force secondary coverage checks, inducing communication busts and wide-open receiver mismatches."],
      ["How does Fort Dale's defensive front react to spread offensive formations?", "They adjust from their base 'Mint Tite' look into Nickel Over or Even fronts."],
      ["Why is Fort Dale's overall defensive scheme vulnerable to play-action passing?", "Their primary focus is stopping the run at all costs, causing linebackers and safeties to bite hard on run fakes and leave open air behind them."]
    ];

    let cards = [...original];
    let index = 0;
    let flipped = false;

    const el = id => document.getElementById(id);
    const card = el("card");

    function render() {
      flipped = false;
      card.classList.remove("flipped");
      el("question").textContent = cards[index][0];
      el("answer").textContent = cards[index][1];
      el("count").textContent = `${index + 1} / ${cards.length}`;
      el("fill").style.width = `${(index + 1) / cards.length * 100}%`;
      el("reveal").textContent = "Reveal Answer";
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle("flipped", flipped);
      el("reveal").textContent = flipped ? "Show Question" : "Reveal Answer";
    }

    function move(n) {
      index = (index + n + cards.length) % cards.length;
      render();
    }

    el("scene").onclick = flip;
    el("reveal").onclick = flip;
    el("prev").onclick = () => move(-1);
    el("next").onclick = () => move(1);

    el("shuffle").onclick = () => {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      index = 0;
      render();
    };

    el("restart").onclick = () => {
      cards = [...original];
      index = 0;
      render();
    };

    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target.tagName !== "BUTTON") {
        e.preventDefault();
        flip();
      }
      if (e.key === "Enter" && e.target === el("scene")) {
        e.preventDefault();
        flip();
      }
      if (e.key === "ArrowLeft") move(-1);
      if (e.key === "ArrowRight") move(1);
    });

    render();
  </script>
</body>
</html>
