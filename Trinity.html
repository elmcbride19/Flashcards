<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c3467">
<title>Trinity Scouting Flashcards</title>
<style>
  :root { --navy:#0c3467; --cardinal:#c41e3a; }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    background:linear-gradient(145deg,#071d3a,var(--navy) 55%,#122b4a);
    font-family:Georgia,serif;
  }
  main { width:min(760px,100%); margin:auto; padding:24px 18px 34px; }
  header { color:white; text-align:center; margin-bottom:18px; }
  .eyebrow {
    margin:0 0 5px; color:#ffccd2;
    font:700 12px Arial,sans-serif;
    letter-spacing:.18em; text-transform:uppercase;
  }
  h1 { margin:0; font-size:clamp(25px,6vw,40px); }
  .sub { color:#dbe6f5; font:15px Arial,sans-serif; }
  .progress {
    height:7px; overflow:hidden; margin:16px 0 9px;
    border-radius:99px; background:#ffffff32;
  }
  .progress span {
    display:block; height:100%; background:var(--cardinal);
    transition:width .25s;
  }
  .meta {
    display:flex; justify-content:space-between;
    color:#dbe6f5; font:700 13px Arial,sans-serif;
  }
  .card {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:25px; width:100%; min-height:390px;
    margin:15px 0; padding:30px clamp(25px,7vw,60px);
    border:0; border-radius:22px;
    background:white; color:#172033;
    box-shadow:0 18px 50px #0005; cursor:pointer;
  }
  .card.answer { background:var(--cardinal); color:white; }
  .label {
    color:var(--cardinal); font:800 12px Arial,sans-serif;
    letter-spacing:.18em; text-transform:uppercase;
  }
  .answer .label { color:#ffe3e7; }
  .text {
    margin:0; text-align:center; font-family:Georgia,serif;
    font-size:clamp(21px,4.7vw,33px); line-height:1.34;
    overflow-wrap:anywhere;
  }
  .hint { opacity:.7; font:13px Arial,sans-serif; }
  .controls {
    display:grid; grid-template-columns:1fr 1.35fr 1fr; gap:10px;
  }
  .control {
    min-height:50px; border:1px solid #ffffff45;
    border-radius:12px; color:white; background:#ffffff17;
    font:700 15px Arial,sans-serif; cursor:pointer;
  }
  .control:hover { background:#ffffff27; }
  .primary { border-color:var(--cardinal); background:var(--cardinal); }
  .primary:hover { background:#a91529; }
  .tools { display:flex; justify-content:center; gap:10px; margin-top:11px; }
  .tools button {
    padding:10px 16px; border:0; border-radius:999px;
    color:#dbe6f5; background:transparent;
    font:700 13px Arial,sans-serif; cursor:pointer;
  }
  .tools button:hover { background:#ffffff14; }
  footer {
    margin-top:17px; color:#b7c9df; text-align:center;
    font:12px/1.5 Arial,sans-serif;
  }
  button:focus-visible { outline:3px solid #ffcc66; outline-offset:4px; }
  @media(max-width:520px) {
    main { padding-top:17px; }
    .card { min-height:430px; padding-inline:27px; }
    .controls { grid-template-columns:1fr 1fr; }
    .primary { grid-column:1/-1; grid-row:1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Montgomery Academy Football</p>
    <h1>Trinity Scouting Flashcards</h1>
    <p class="sub">Tap the card to reveal the answer.</p>
  </header>

  <div class="progress"><span id="bar"></span></div>
  <div class="meta">
    <span id="count"></span>
    <span id="side">QUESTION</span>
  </div>

  <button class="card" id="card" aria-label="Reveal answer">
    <span class="label" id="label">Question</span>
    <span class="text" id="text"></span>
    <span class="hint" id="hint">Tap to reveal answer</span>
  </button>

  <div class="controls">
    <button class="control" id="prev">← Previous</button>
    <button class="control primary" id="flip">Reveal answer</button>
    <button class="control" id="next">Next →</button>
  </div>
  <div class="tools">
    <button id="shuffle">↻ Shuffle cards</button>
    <button id="restart">Restart</button>
  </div>
  <footer>Keyboard: Space flips · Arrow keys move between cards</footer>
</main>

<script>
const original = [

    "6'0\", 164 lbs; primary middle safety in 3-deep structure; light in the box"
  ],
  [

    "3-deep safety structure playing double-cut coverage on both sides."
  ],
  [
    "What is the scouting profile and technique of defensive Nose #13?",

  ],
  [
    "What pre-snap alignment tell indicates an ISO run concept by Trinity?",
    "Offensive tackles scooting wide (~3 yards) and F backed up."
  ],
  [
    "How does Trinity's defense adjust coverage in single WR heavy sets (black/green 12 personnel)?",
    "Single WR Heavy Isolation: walks the corner down while the safety plays meg 10-12 yards off."
  ],
  [
    "What coverage rule must defenders enforce against RB #6 on pass releases?",
    "Do not allow free releases due to his smaller frame."
  ],
  [
    "Why is Center #72 identified as the clear liability on Trinity's offensive line?",
    "He is under 200 lbs and the weakest blocker on the unit; hidden intentionally via outside runs and screens; defense must attack him directly."
  ],
  [
    "What are the receiving tendencies and physical traits of Slot/H-Back #7?",
    "6'2\", 172 lb junior (297 yards); heaviest skill position player on the roster; works the middle of the field catching underneath."
  ],
  [
    "How can the offensive game plan exploit Trinity's single-side receiver isolation in heavy sets?",
    "Expand the box in 10 personnel, shift to 12 personnel, and throw access/isolation to the single receiver against the walked-down corner."
  ],
  [
    "How are TEs #10 and #12 utilized in Trinity's offense?",
    "Situational 12-personnel tight ends; used primarily as formation pieces rather than pass catchers."
  ],
  [
    "What is Corner #9's positional background?",
    "6'0\", 171 lbs; former middle safety taking corner reps due to personnel needs; versatile but stretched across roles."
  ],
  [
    "Which offensive linemen pull in Trinity's gap/pin-and-pull scheme?",
    "Whoever is uncovered."
  ],
  [
    "What specific play design should be alerted whenever QB #11 lines up at WR?",
    "Near-certain double-pass alert (reverse hand-off to #11, followed by a throw)."
  ],
  [
    "What technique flaw defines 4-tech #15?",
    "6'0\", 175 lb sophomore forced into 4-tech who relies on spin-offs and finesse"
  ],
  [
    "What is the mechanics of Trinity's boundary 'loop' stunt involving OLB/9-tech #4?",
    "#4 (5'11\", 162 lbs) flips with #13 between 9-tech and nose, executing a weakside stunt where #4 and #9 chase pullers into backside gaps."
  ],
  [
    "What is the physical tendency of primary 4-tech #54?",
    "6'3\", 203 lb senior; plays with length and better comfort in mint; stays home."
  ],
  [
    "What athletic limitation defines RT #57, and how should defenders play him?",
    "Largest lineman with athletic decline who will not chase relocated defenders; defenders should move away from him and avoid engaging stationary."
  ],
  [
    "What is the scouting profile and situational blitz threat of ILB #10?",
    "6'3\", 205 lb senior high-volume tackler ('kid with 5,000 tackles'); disciplined run fitter but vulnerable in pass coverage; situationally blitzes interior gaps on 3rd & long."
  ],
  [
    "What key pre-snap motion indicator signals Trinity's intended run direction?",
    "Receiver #7 takes you toward the ball on ~100% of snaps (except on backside arc for slot counter GT)."
  ],
  [

    "Base Mint front with head-up 4-techs (#54/#15) and intermittent 4i, slanting post-snap to strength."
  ],
  [

  ],
  [

    "6'1\", 185 lbs; bigger safety providing strong run fit support."
  ],
  [
    "How does Trinity's backside 4-tech react to true eagle offensive looks?",
    "Static; does not adjust post-snap and stays put."
  ],
  [

    "6'1\", 185 lb sophomore punter/QB; elite versatile athlete with an accurate ~87 mph arm."
  ],
  [
    "What is the receiver profile of WR #8?",
    "6'0\", 164 lbs; team-leading receiver (308 yards); primary deep-threat target with a vertical and intermediate route profile."
  ],
  [

    "Meg Mix (man coverage on #1, mixing rules on #2 and #3)."
  ],
  [

    "5'8\", 159 lbs; most shifty back, but limited to outside run concepts; catches out of the backfield into flats and screens."
  ],
  [
    "What is the role and style of primary RB #9?",
    "6'0\", 171 lb senior primary back; perimeter threat who releases into flats and rails frequently; currently banged up."
  ],

    "Reverts back to their base double-cut structure."
  ],

    "Controlled, formation-heavy, and huddle-based, relying on numbers and run-game structure rather than tempo."
  ],

    "Placing their heads on the outside on kick-out blocks."
  ],

    "They cheat splits inward (<2 feet) for outside runs and widen their splits for inside runs."
  ],
  [

    "5'11\", 221 lb senior rotational nose; Trinity's only true space-eating body brought in against heavy personnel looks."
  ],
  [

    "Match the guard and play the screen rather than rushing the pass."
  ],
  [
    "What is the primary role of RB #1 in Trinity's offensive system?",
    "5'10\", 152 lbs; primary jet sweep weapon and most dynamic playmaker of the RB group; treated functionally as a receiver."
  ],
  [
    "How does RB #6 compare in running style to primary RB #9?",
    "5'9\", 154 lbs; faster and runs harder than #9, capable of executing any run concept in the scheme."
  ],
  [
    "What weakness does OLB #12 exhibit?",
    "5'7\", 187 lb junior non-natural mover in space"
  ],
  [
    "What is Slot/H-Back #7's primary blocking limitation, and how must perimeter defenders exploit it?",
    "At 172 lbs, he cannot sustain blocks against physical defenders; perimeter defenders must dominate matchups and deny crack blocks."
  ],
  [
    "Who makes up Trinity's starting offensive line from left tackle to right tackle?",
    "LT #65 (So) | LG #55 (Jr) | C #72 (So) | RG #50 (Sr) | RT #57 (Sr)."
  ],
  [
    "What is the scouting profile and physical style of starting QB #5?",
    "6'3\", 172 lb left-handed junior; physical downhill runner in gap/read scheme who takes contact, but is inaccurate as a passer and abandons the pocket quickly under pressure."
  ],
  [
    "What pass coverage key is triggered when Trinity lines up with a Tight End?",
    "Use TE as a free safety push key (push free over; corner becomes rob)."
  ],
  [
    "What is the route concept usage for WR #23?",
    "5'9\", 148 lbs; least productive receiver, targeted primarily on shorter, lateral-based route concepts."
  ],
  [
    "How has QB #5's running mobility changed since his freshman year?",
    "He is notably slower and is now regularly being caught by linebackers."
  ]
];

let cards = original.slice();
let index = 0;
let flipped = false;
const el = id => document.getElementById(id);

function render() {
  el("text").textContent = cards[index][flipped ? 1 : 0];
  el("count").textContent = `Card ${index + 1} of ${cards.length}`;
  el("bar").style.width = `${(index + 1) / cards.length * 100}%`;
  el("card").classList.toggle("answer", flipped);
  el("side").textContent = flipped ? "ANSWER" : "QUESTION";
  el("label").textContent = flipped ? "Answer" : "Question";
  el("flip").textContent = flipped ? "Show question" : "Reveal answer";
  el("hint").textContent = flipped
    ? "Tap to return to question"
    : "Tap to reveal answer";
  el("card").setAttribute("aria-label",
    flipped ? "Show question" : "Reveal answer");
}

function flip() {
  flipped = !flipped;
  render();
}

function move(direction) {
  index = (index + direction + cards.length) % cards.length;
  flipped = false;
  render();
}

el("card").onclick = flip;
el("flip").onclick = flip;
el("prev").onclick = () => move(-1);
el("next").onclick = () => move(1);

el("restart").onclick = () => {
  cards = original.slice();
  index = 0;
  flipped = false;
  render();
};

el("shuffle").onclick = () => {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  flipped = false;
  render();
};

document.addEventListener("keydown", event => {
  if (event.target.closest("button,input,textarea,select")) return;
  if (event.code === "Space") {
    event.preventDefault();
    flip();
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    move(1);
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    move(-1);
  }
});

render();
</script>
</body>
</html>
