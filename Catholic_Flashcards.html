<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c3467">
  <title>Catholic Scouting Flashcards</title>
  <style>
    :root { --navy:#0c3467; --cardinal:#c41e3a; --ink:#172033; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(145deg,#071d3a,var(--navy) 55%,#122b4a); font-family:Georgia,serif; }
    main { width:min(760px,100%); margin:auto; padding:24px 18px 34px; }
    header { color:white; text-align:center; margin-bottom:18px; }
    .eyebrow { margin:0 0 5px; color:#ffccd2; font:700 12px/1.2 Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(25px,6vw,40px); }
    .sub { margin:7px 0 0; color:#dbe6f5; font:15px/1.4 Arial,sans-serif; }
    .progress { height:7px; overflow:hidden; margin:16px 0 9px; border-radius:99px; background:#ffffff32; }
    .progress span { display:block; width:0; height:100%; background:var(--cardinal); transition:width .25s ease; }
    .meta { display:flex; justify-content:space-between; color:#dbe6f5; font:700 13px Arial,sans-serif; }
    .stage { perspective:1100px; margin:15px 0; }
    .card { position:relative; width:100%; min-height:390px; border:0; padding:0; cursor:pointer; background:transparent; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.75,.25,1); }
    .card.flipped { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:42px clamp(25px,7vw,60px); border-radius:22px; backface-visibility:hidden; box-shadow:0 18px 50px #0005; background:white; }
    .back { color:white; background:linear-gradient(145deg,#a91529,var(--cardinal)); transform:rotateY(180deg); }
    .label { position:absolute; top:25px; color:var(--cardinal); font:800 12px Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    .back .label { color:#ffe3e7; }
    .text { margin:0; text-align:center; font-size:clamp(21px,4.7vw,33px); line-height:1.34; }
    .hint { position:absolute; bottom:22px; opacity:.7; font:13px Arial,sans-serif; }
    .controls { display:grid; grid-template-columns:1fr 1.35fr 1fr; gap:10px; }
    button.control { min-height:50px; border:1px solid #ffffff45; border-radius:12px; color:white; background:#ffffff17; font:700 15px Arial,sans-serif; cursor:pointer; }
    button.control:hover { background:#ffffff27; }
    button.primary { border-color:var(--cardinal); background:var(--cardinal); }
    .tools { display:flex; justify-content:center; gap:10px; margin-top:11px; }
    .tools button { padding:10px 16px; border:0; border-radius:999px; color:#dbe6f5; background:transparent; font:700 13px Arial,sans-serif; cursor:pointer; }
    .tools button:hover { background:#ffffff14; }
    footer { margin-top:17px; color:#b7c9df; text-align:center; font:12px/1.5 Arial,sans-serif; }
    @media (max-width:520px) { main{padding-top:17px}.card{min-height:430px}.controls{grid-template-columns:1fr 1fr}.primary{grid-column:1/-1;grid-row:1}.face{padding-inline:27px} }
  </style>
</head>
<body>
<main>
  <header><p class="eyebrow">Montgomery Academy Football</p><h1>Catholic Scouting Flashcards</h1><p class="sub">Tap the card to reveal the answer.</p></header>
  <div class="progress"><span id="bar"></span></div>
  <div class="meta"><span id="count"></span><span id="side">QUESTION</span></div>
  <div class="stage"><button class="card" id="card" aria-label="Flip flashcard">
    <section class="face front"><span class="label">Question</span><p class="text" id="question"></p><span class="hint">Tap to reveal answer</span></section>
    <section class="face back"><span class="label">Answer</span><p class="text" id="answer"></p><span class="hint">Tap to return to question</span></section>
  </button></div>
  <div class="controls"><button class="control" id="prev">← Previous</button><button class="control primary" id="flip">Reveal answer</button><button class="control" id="next">Next →</button></div>
  <div class="tools"><button id="shuffle">↻ Shuffle cards</button><button id="restart">Restart</button></div>
  <footer>Keyboard: Space flips · Arrow keys move between cards</footer>
</main>
<script>
const original=[["What is the primary blitz tell for Catholic's Will linebacker (#6)?","A walked-up pre-snap posture indicates he is coming on a blitz."],["How should the offense adjust to Nose #55 to neutralize his strength?","Utilize rapid tempo and double-teams to wear him down."],["What is the primary coverage rule for Catholic's secondary in standard 2 × 2 looks?","Mod coverage."],["How does the backside safety behave in 3 × 1 trips coverage?","He poaches the vertical route of the #3 receiver, leaving the backside X isolated."],["Which defensive personnel grouping is used specifically for 'Pass Heavy' downs?","Situational Personnel: Dollar."],["What is the specific technique used by Nose #55 to control blockers?","Extremely heavy, extended hands rather than a pure bull rush."],["Which player is identified as the core back-end communicator for Catholic's defense?","Safety #22."],["What vulnerability exists for Safety #5 in the run game?","He is less committed as a run fitter and often avoids contact in B/C-gap fits."],["What is the defensive strategy for the 'X Over' motion?","Alert for a 100% perimeter run."],["What is the primary pressure piece for Catholic's defensive edge?","Will linebacker #6."],["Which defensive personnel grouping is activated to rest starters after a tempo drive?","Base Personnel: Slant."],["What is the specific assignment for Hubb in 'Situational Personnel: 13'?","To the Tight End."],["What is the vulnerability of Catholic's boundary OLB (#9/59)?","He is weak in coverage."],["In the 'Mint' front, what is the stance requirement for the defensive interior?","4-point balanced stances with 'butt down' to move laterally."],["How does the defense handle the TE in 'Nickel Even' when the Sam 'solids' him and he's at T?","DNC the front in 11 personnel."],["What is the estimated internal clock for QB #10 under pressure?","Approximately 2 seconds."],["What physical trait defines Catholic's QB #10 in the pocket?","He stands very upright, offering a clear view of his posture."],["What is the primary mobility profile of QB #10?","Strictly pocketbound and not a scramble threat."],["On which specific routes does QB #10 demonstrate 'outstanding arm talent'?","Deep ball post and fade routes."],["What is the observed pass/run balance for Catholic's offensive par downs?","Pass-heavy tendency at approximately 65%."],["What is the primary signal used by QB #10 to call for the snap?","A single loud clap."],["What specific shift indicates a likely field-side sweep?","Pre-snap shifts creating a strong-side overload with a TE/Wing."],["What physical 'tell' distinguishes Catholic's primary RB #7?","He wears white gloves and white cleats."],["Which player is identified as the team's most dynamic 'game-breaker' athlete?","WR #1."],["How is WR #12 utilized in the offensive formation?","As a hybrid field receiver who mainly aligns wide."],["What is the height and weight of WR #1?","5′9″ and 146 lbs."],["What is the major vulnerability of Catholic's offensive tackles in pass protection?","They are slow and tend to stand straight up rather than maintain a low base."],["What is the offensive line's stance tell regarding position?","Guards are in a 3-point stance, while Tackles are in a 2-point stance."],["What is the main strategy to defeat Catholic's offensive tackles?","Speed rushes are highly effective."],["What percentage of passing yards is accounted for by WR #1 and WR #8 combined?","Over 74%."],["What are the primary run schemes used by Catholic's offense?","Stretch, GT, Buck"],["What is the substitution tell for WR #8?","He is not on the field every play; watch for him to enter specifically for deep shots."],["Which linebacker enters the backfield for the 'Wildcat' package?","#11"],["What is the status of Catholic's offensive line starters?","Unsettled, indicated by frequent rotations."],["How is the 'screen execution' of Catholic's offense described?","Very weak; the defense should stay disciplined on outer leverage."],["What is the 'Mike' linebacker's primary role in run defense?","Stays strictly in the core to fit runs downhill."],["What is the 'Opp PAT/FG' block alignment used by Catholic?","Double Wing Left (3 Eligibles). We'll flip and travel a LB."],["What is the estimated distance capability of Catholic's kicker?","40+ yards."],["Which 2-point play is specifically identified for PAT and Field Goal scenarios?","Blue Right Curve"],["What is the 'Opp Block' strategy for Catholic's PAT and Field Goal units?","Flexing out the side away from the kicker."],["Which 'Passes We Like' concept is specifically used for 'Bunch Concepts'?","Snap (or Snap Switch)."],["What is the primary 'Attack Plan' against Field OLB #0?","Run straight downhill in tight spaces to force C-gap fits."],["What is the primary tell for the Boundary OLB #9/59 regarding pressure?","He walks down to a 5-tech on the eagle side."],["In the 'Catholic O-Summary', how many receptions does WR #1 have in one game?","12"],["What is the Mike's assignment if he is in a 'Fiddle' call in 'Mint Okie Slant'?","Cover the Will/Dog's job if they have to apex and blitz."],["In 'A Shell' coverage, which receiver is the defense 'Mixing' at all times?","Receiver #1."],["What is the primary defensive adjustment for the 'attached H/Y motions' known as Hop and Yop?","Seesaw the LBs over if in Meg coverage."],["What is the Mike's technique for 'Match Quick' calls in Nickel Even Mirror?","Match the F-back and redirect on opposite Guard pulls."],["How many defenders did Eufaula rush to win consistently against Catholic's tackles?","3 defenders."],["What is the specific 'Usage' for Base Personnel: 10?","More A & W Shell, needing 3 Safeties on Par Down."],["In the Nickel alignment, what is the 'Stance Tell' for defensive guards versus tackles?","Guards are in a 3-point stance, and Tackles are in a 2-point stance."],["What physical profile does Corner #2 possess?","5′10″ and 170 lbs."],["What is the primary vulnerability of Corner #2 that the offense can exploit?","He is highly jumpy and potentially intimidated by physical size matchups."],["In the 'Heavy' formation diagram, which player are the off ball linebackers looking at?","The H-back."],["What is the primary objective of using 'Sugar Huddle' against Catholic's defense?","To strain defensive communication on internal shifts and pressures."],["What is the defensive priority regarding coverage questions for WR #1?","Doubling him in some capacity at all times."],["In 'A Shell' coverage, when the look is balanced, where should the defense roll the coverage?","Roll it to the field (F)."],["How will we handle #22 in 11 personnel?","Solid the Star. DNC the front away if he's TE at T."],["Which way should we roll to B from A?","To the Field, if MoF roll to #1."],["In Wide Flex, when should we bump Bear instead of Flex?","When the Flex side has the TE at T so the OLB can Meg him."],["When should an Edge check play?","4 man surface, no Solid LB"],["How do we handle a Twist shift by the TE and Wing in 11?","Seesaw the LBs over and bump Rip/Liz"],["What is their expected defensive front when we are 2x2?","Mint Okie Eagle"],["What is their expected defensive front when we are 3x1?","Nickel Even"]]; let cards=original.slice(),index=0,flipped=false; const el=id=>document.getElementById(id);
function render(){el('question').textContent=cards[index][0];el('answer').textContent=cards[index][1];el('count').textContent='Card '+(index+1)+' of '+cards.length;el('bar').style.width=((index+1)/cards.length*100)+'%';el('card').classList.toggle('flipped',flipped);el('side').textContent=flipped?'ANSWER':'QUESTION';el('flip').textContent=flipped?'Show question':'Reveal answer'}
function flip(){flipped=!flipped;render()} function move(n){index=(index+n+cards.length)%cards.length;flipped=false;render()}
el('card').onclick=flip;el('flip').onclick=flip;el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);
el('restart').onclick=()=>{cards=original.slice();index=0;flipped=false;render()};
el('shuffle').onclick=()=>{for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;flipped=false;render()};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});render();
</script></body></html>
